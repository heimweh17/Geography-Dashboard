apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Geography Dashboard
        folder: Geography Dashboard
        type: file
        options:
          path: /var/lib/grafana/dashboards
  geodashboard-overview.json: |
    {
      "title": "Geography Dashboard Local Platform",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "panels": [
        {
          "type": "stat",
          "title": "Core API Availability",
          "datasource": "Prometheus",
          "targets": [{"expr": "up{job=\"core-api\"}"}],
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0}
        },
        {
          "type": "timeseries",
          "title": "Request Rate",
          "datasource": "Prometheus",
          "targets": [{"expr": "sum(rate(geodashboard_http_requests_total{service=\"geo-dashboard-api\"}[5m]))"}],
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 0}
        },
        {
          "type": "timeseries",
          "title": "p95 API Latency",
          "datasource": "Prometheus",
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(geodashboard_http_request_duration_seconds_bucket{service=\"geo-dashboard-api\"}[5m])) by (le))"}],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
        },
        {
          "type": "timeseries",
          "title": "5xx Responses",
          "datasource": "Prometheus",
          "targets": [{"expr": "sum(rate(geodashboard_http_requests_total{service=\"geo-dashboard-api\",status_code=~\"5..\"}[5m]))"}],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/geodashboard-overview.json
              subPath: geodashboard-overview.json
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30030
