apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: core-api
        metrics_path: /metrics
        static_configs:
          - targets: [core-api:8000]
  alerts.yml: |
    groups:
      - name: geodashboard-local
        rules:
          - alert: CoreApiUnavailable
            expr: up{job="core-api"} == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Core API is unavailable in the local cluster.
          - alert: CoreApiHigh5xxRate
            expr: sum(rate(geodashboard_http_requests_total{service="geo-dashboard-api",status_code=~"5.."}[5m])) / clamp_min(sum(rate(geodashboard_http_requests_total{service="geo-dashboard-api"}[5m])), 1) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Core API 5xx rate exceeds 5 percent.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
