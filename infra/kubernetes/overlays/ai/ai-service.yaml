apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
    spec:
      containers:
        - name: ai-service
          image: geo-dashboard-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: APP_MODULE
              value: app.ai_main:app
            - name: SERVICE_NAME
              value: geo-dashboard-ai
          envFrom:
            - configMapRef:
                name: geodashboard-config
            - secretRef:
                name: geodashboard-secrets
            - secretRef:
                name: geodashboard-ai-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app.kubernetes.io/name: ai-service
  ports:
    - name: http
      port: 8000
      targetPort: http
