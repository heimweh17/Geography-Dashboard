apiVersion: batch/v1
kind: Job
metadata:
  name: geodashboard-migrate
  namespace: geo-dashboard
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: geo-dashboard-api:local
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: geodashboard-config
            - secretRef:
                name: geodashboard-secrets
